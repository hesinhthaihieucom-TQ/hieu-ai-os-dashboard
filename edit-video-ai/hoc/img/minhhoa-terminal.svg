<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Hình minh hoạ cửa sổ lệnh đang chạy Claude Code">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1b1b"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient></defs>
  <rect x="10" y="10" width="620" height="320" rx="16" fill="url(#g)" stroke="#F0C24B" stroke-opacity=".55" stroke-width="1.5"/>
  <rect x="10" y="10" width="620" height="40" rx="16" fill="#222"/><rect x="10" y="34" width="620" height="16" fill="#222"/>
  <circle cx="36" cy="30" r="6" fill="#ef4444"/><circle cx="58" cy="30" r="6" fill="#F0C24B"/><circle cx="80" cy="30" r="6" fill="#4ade80"/>
  <text x="320" y="35" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="13" fill="#999">thư-mục-bộ-kit — claude</text>
  <g font-family="Menlo,Consolas,monospace" font-size="16">
    <text x="34" y="86" fill="#F0C24B">$</text><text x="54" y="86" fill="#fff">claude --version</text>
    <text x="34" y="112" fill="#a7f3d0">2.x.x (Claude Code)</text>
    <text x="34" y="152" fill="#F0C24B">$</text><text x="54" y="152" fill="#fff">claude</text>
    <rect x="34" y="172" width="572" height="88" rx="10" fill="#141414" stroke="#F0C24B" stroke-opacity=".35"/>
    <text x="52" y="200" fill="#F0C24B">✻ Chào mừng đến với Claude Code</text>
    <text x="52" y="226" fill="#bbb">Gõ /hieukenh-help để kiểm tra máy</text>
    <text x="52" y="248" fill="#bbb">Gõ /hieukenh để dựng video</text>
    <text x="34" y="296" fill="#F0C24B">&gt;</text><rect x="52" y="282" width="10" height="18" fill="#F0C24B" opacity=".85"/>
  </g>
  <text x="630" y="328" text-anchor="end" font-family="sans-serif" font-size="11" fill="#666">Hình minh hoạ</text>
</svg>
