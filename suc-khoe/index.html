<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hiểu Để Khoẻ Mạnh</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14201B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hiểu Để&#10;Khoẻ Mạnh">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo-hieu-manh.png" type="image/png">
<link rel="apple-touch-icon" href="assets/logo-hieu-manh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Bắt sự kiện cài PWA CÀNG SỚM CÀNG TỐT — trình duyệt chỉ bắn đúng 1 lần, bắt muộn có thể lỡ mất
  // (copy quy tắc từ nhan-hieu/index.html và tai-chinh/index.html).
  window.__deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.__deferredInstallPrompt = e;
  });
</script>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/util.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/trang-chu.js"></script>
<script src="js/kiem-tra-suc-khoe.js"></script>
<script src="js/theo-doi-tuan.js"></script>
<script src="js/lich-trinh.js"></script>
<script src="js/thu-vien-suc-khoe.js"></script>
<script src="js/cau-chuyen-thanh-cong.js"></script>
<script src="js/san-pham.js"></script>
<script src="js/tich-diem-hoa-hong.js"></script>
<script src="js/tuyen-doi-tac.js"></script>
<script src="js/tai-khoan.js"></script>
<script src="js/quan-tri.js"></script>
<script src="js/app-shell.js"></script>
<script>
  // Đăng ký service worker để trình duyệt cho phép "Thêm vào màn hình chính" như 1 app thật —
  // sw.js không cache gì cả (network passthrough), tránh bug cache JS/CSS cũ (copy quy tắc từ
  // nhan-hieu/index.html, tai-chinh/index.html).
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
</script>
</body>
</html>
