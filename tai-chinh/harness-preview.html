<meta charset="UTF-8">

<body>
<div id="app"></div>

<script>
const REFERRALS = [
  { id:'r1', referrer_id:'admin-1', referee_id:'member-1', reward_amount:59800, paid:false, created_at:new Date().toISOString() },
  { id:'r2', referrer_id:'admin-1', referee_id:'member-2', reward_amount:59800, paid:true, paid_at:new Date().toISOString(), created_at:new Date().toISOString() },
];
const PROFILES_BY_ID = {
  'admin-1': { id:'admin-1', role:'admin', full_name:'Chị Quỳnh', email:'quynh@test.com', ref_code:'XNHADMIN1', tc_has_paid:true, tc_trial_started_at:new Date(Date.now()-86400000*20).toISOString(), tc_review_prompt_dismissed:false },
  'member-1': { id:'member-1', role:'student', full_name:'Khách A', email:'a@test.com' },
  'member-2': { id:'member-2', role:'student', full_name:'Khách B', email:'b@test.com' },
};
// Mô phỏng thật bảng module_drafts (key = module_key) để test đúng luồng lưu/khôi phục nháp —
// trước đây upsert() chỉ trả về thành công giả, không lưu gì thật, nên KHÔNG test được vụ Quỳnh báo
// "mất nội dung đang làm dở" (2026-08-24). Object riêng, sống theo session của tab, mất khi F5.
const MODULE_DRAFTS = {};
// Mô phỏng thật tc_networth_snapshots (key = snapshot_month) — để test đúng vụ vừa thêm cột
// estimated_income/estimated_expense/passive_income/income_sources (2026-08-24, góp ý Quỳnh "cần
// có chỗ cho những thứ đó") có thật sự đọc/ghi lại đúng hay không.
const NETWORTH_SNAPSHOTS = {};
// Dữ liệu giả cho tc_finance_entries — để test thật biểu đồ Chi tiết/Xu hướng kiểu Money Lover
// (2026-08-24, góp ý Quỳnh) ở Tổng Kết Tuần/Tháng, rải đều vài ngày trong tháng hiện tại.
function pad2(n){ return String(n).padStart(2,'0'); }
const TODAY = new Date();
const YM = `${TODAY.getFullYear()}-${pad2(TODAY.getMonth()+1)}`;
const FINANCE_ENTRIES = [1,2,5,8,12,15,18,22,26].map((day,i)=>({
  id:'e'+i, user_id:'admin-1', entry_date:`${YM}-${pad2(Math.min(day, new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate()))}`,
  type:'expense', amount: 200000 + i*150000,
  category_label: ['Ăn uống','Di chuyển','Mua sắm','Ăn uống','Giải trí','Di chuyển','Ăn uống','Hoá đơn','Mua sắm'][i],
  vibe: ['green','red','gray'][i%3],
}));
// Mô phỏng thật tc_categories (2026-08-24, góp ý Quỳnh "muốn danh mục là thiết lập ban đầu") — để
// test luồng thiết lập/tự điền phân loại ở danh-muc.js + ghi-chep.js + muc-tieu-cam-ket.js (Ngân
// sách hiện đủ danh mục). Bắt đầu RỖNG để test được cả nhánh ensureCategoriesSeeded() seed lần đầu.
const CATEGORIES = [];
let categoryIdSeq = 1;
// Mô phỏng thật tc_debts — để test luồng thêm/sửa khoản nợ (cost_type, 3 tiêu chí Nợ Kiến Tạo/Hoảng
// Loạn) và chiến lược trả nợ ở quan-ly-no.js. Bắt đầu RỖNG, thêm qua form ngay trong trang.
const DEBTS = [];
let debtIdSeq = 1;
const KARMA_HISTORY = [];
let karmaHistoryIdSeq = 1;
// Mô phỏng tc_monthly_reflections (key = month) — để test luồng chọn NHIỀU trụ (goal_houses jsonb
// array, 2026-08-26 góp ý Quỳnh) đọc/ghi đúng hay không.
const MONTHLY_REFLECTIONS = {};
// Mô phỏng app_reviews (CHUNG bảng với nhan-hieu, lọc app='tai-chinh') — để test popup xin đánh giá,
// khối review ở Trang chủ, và tab Đánh Giá bên Quản Trị (2026-08-26).
const APP_REVIEWS = [
  { id:'rev1', user_id:'member-1', app:'tai-chinh', comment:'App giúp em hiểu tiền vào ra do đâu, rất hay!', display_name:'Khách A', approved:true, created_at:new Date().toISOString() },
  { id:'rev2', user_id:'member-2', app:'tai-chinh', comment:'Chờ duyệt: phần quản lý nợ dễ hiểu.', display_name:'Khách B', approved:false, created_at:new Date().toISOString() },
];
let appReviewIdSeq = 1;
let financeEntryIdSeq = 1000;
// Mô phỏng tc_core_beliefs + tc_yearly_reflections — để test mục "Tổng Kết Năm" mới (2026-08-26,
// góp ý Quỳnh) đọc đúng Hạt Giống trong năm + lưu/đọc lời cam kết năm tới.
const CORE_BELIEFS = [
  { id:'cb1', user_id:'admin-1', belief_text:'Tiền là thứ khan hiếm, phải giữ chặt mới an toàn.', still_active:false, created_at:new Date(TODAY.getFullYear(),2,15).toISOString() },
  { id:'cb2', user_id:'admin-1', belief_text:'Mình không xứng đáng có dòng tiền tự động.', still_active:true, created_at:new Date(TODAY.getFullYear(),6,3).toISOString() },
];
const YEARLY_REFLECTIONS = {};
// Mô phỏng sepay_transactions (CHUNG bảng với nhan-hieu) — để test tab Tài Chính bên Quản Trị chỉ
// tính đúng 3 mức giá tai-chinh (299k/599k/999k), không lẫn doanh thu nhan-hieu.
const SEPAY_TXNS = [
  { id:'tx1', transfer_amount:299000, status:'matched', ref_code_found:'ABC123', matched_profile_id:'member-1', created_at:new Date().toISOString() },
  { id:'tx2', transfer_amount:599000, status:'matched', ref_code_found:'DEF456', matched_profile_id:'member-2', created_at:new Date(Date.now()-86400000*40).toISOString() },
  { id:'tx3', transfer_amount:150000, status:'matched', ref_code_found:'NHANHIEU1', matched_profile_id:'member-1', created_at:new Date().toISOString() },
];
function makeChain(table){
  const chain = {
    _filters: {}, _inFilters: {}, _range: {},
    select(){ return chain; },
    eq(col, val){ chain._filters[col]=val; return chain; },
    in(col, vals){ chain._inFilters[col]=vals; return chain; },
    gte(col, val){ chain._range[col] = chain._range[col]||{}; chain._range[col].gte = val; return chain; },
    lte(col, val){ chain._range[col] = chain._range[col]||{}; chain._range[col].lte = val; return chain; },
    lt(col, val){ chain._range[col] = chain._range[col]||{}; chain._range[col].lt = val; return chain; },
    order(){ return chain; }, limit(){ return chain; }, not(){ return chain; },
    upsert(payload){
      if(table==='module_drafts'){
        const rows = Array.isArray(payload) ? payload : [payload];
        rows.forEach(r=>{ MODULE_DRAFTS[r.module_key] = r.data; });
      }
      if(table==='tc_networth_snapshots'){
        const rows = Array.isArray(payload) ? payload : [payload];
        rows.forEach(r=>{ NETWORTH_SNAPSHOTS[r.snapshot_month] = { ...(NETWORTH_SNAPSHOTS[r.snapshot_month]||{}), ...r }; });
      }
      if(table==='tc_monthly_reflections'){
        const rows = Array.isArray(payload) ? payload : [payload];
        rows.forEach(r=>{ MONTHLY_REFLECTIONS[r.month] = { ...(MONTHLY_REFLECTIONS[r.month]||{}), ...r }; });
      }
      if(table==='tc_yearly_reflections'){
        const rows = Array.isArray(payload) ? payload : [payload];
        rows.forEach(r=>{ YEARLY_REFLECTIONS[r.year] = { ...(YEARLY_REFLECTIONS[r.year]||{}), ...r }; });
      }
      return Promise.resolve({ data:null, error:null });
    },
    maybeSingle(){
      if(table === 'profiles') return Promise.resolve({ data: PROFILES_BY_ID[chain._filters.id] || null, error:null });
      if(table === 'module_drafts'){
        const key = chain._filters.module_key;
        const has = Object.prototype.hasOwnProperty.call(MODULE_DRAFTS, key);
        return Promise.resolve({ data: has ? { data: MODULE_DRAFTS[key] } : null, error:null });
      }
      if(table === 'tc_monthly_reflections'){
        const key = chain._filters.month;
        return Promise.resolve({ data: MONTHLY_REFLECTIONS[key] || null, error:null });
      }
      if(table === 'tc_yearly_reflections'){
        const key = chain._filters.year;
        return Promise.resolve({ data: YEARLY_REFLECTIONS[key] || null, error:null });
      }
      if(table === 'tc_networth_snapshots'){
        const key = chain._filters.snapshot_month;
        return Promise.resolve({ data: NETWORTH_SNAPSHOTS[key] || null, error:null });
      }
      if(table === 'tc_karma_history') return Promise.resolve({ data: chain._insertedKarmaRow || null, error:null });
      if(table === 'tc_debts'){
        const rows = DEBTS.filter(d => Object.keys(chain._filters).every(k => k==='user_id' || String(d[k])===String(chain._filters[k])));
        return Promise.resolve({ data: rows[0] || null, error:null });
      }
      return Promise.resolve({ data: null, error:null });
    },
    single(){ return chain.maybeSingle(); },
    update(payload){
      return { in(col, vals){
        if(table==='tc_referrals') REFERRALS.forEach(r=>{ if(vals.includes(r.id)) Object.assign(r, payload); });
        return Promise.resolve({data:null,error:null});
      }, eq(col, val){
        if(table==='tc_categories') CATEGORIES.forEach(c=>{ if(c[col]===val) Object.assign(c, payload); });
        if(table==='tc_debts') DEBTS.forEach(d=>{ if(String(d[col])===String(val)) Object.assign(d, payload); });
        if(table==='app_reviews') APP_REVIEWS.forEach(r=>{ if(String(r[col])===String(val)) Object.assign(r, payload); });
        if(table==='profiles' && PROFILES_BY_ID[val]) Object.assign(PROFILES_BY_ID[val], payload);
        return Promise.resolve({data:null,error:null});
      } };
    },
    insert(payload){
      if(table==='tc_categories'){
        const rows = Array.isArray(payload) ? payload : [payload];
        rows.forEach(r=>CATEGORIES.push({ id:'cat'+(categoryIdSeq++), ...r }));
      }
      if(table==='tc_debts'){
        const rows = Array.isArray(payload) ? payload : [payload];
        rows.forEach(r=>DEBTS.push({ id:'debt'+(debtIdSeq++), is_paid_off:false, created_at:new Date().toISOString(), ...r }));
      }
      if(table==='tc_karma_history'){
        const rows = Array.isArray(payload) ? payload : [payload];
        rows.forEach(r=>{
          const row = { id:'kh'+(karmaHistoryIdSeq++), taken_at:new Date().toISOString(), ...r };
          KARMA_HISTORY.unshift(row);
          chain._insertedKarmaRow = row;
        });
        return chain; // để .select().maybeSingle() chain tiếp phía sau vẫn hoạt động
      }
      if(table==='app_reviews'){
        const rows = Array.isArray(payload) ? payload : [payload];
        rows.forEach(r=>APP_REVIEWS.unshift({ id:'rev'+(appReviewIdSeq++), approved:false, created_at:new Date().toISOString(), ...r }));
      }
      if(table==='tc_finance_entries'){
        const rows = Array.isArray(payload) ? payload : [payload];
        rows.forEach(r=>FINANCE_ENTRIES.push({ id:'fe'+(financeEntryIdSeq++), created_at:new Date().toISOString(), ...r }));
      }
      return Promise.resolve({ data:null, error:null });
    },
    delete(){
      const delChain = {
        eq(col, val){ chain._filters[col]=val; return delChain; },
        then(resolve){
          if(table==='module_drafts') delete MODULE_DRAFTS[chain._filters.module_key];
          if(table==='tc_categories'){
            const idx = CATEGORIES.findIndex(c=>c.id===chain._filters.id);
            if(idx>=0) CATEGORIES.splice(idx,1);
          }
          if(table==='tc_debts'){
            const idx = DEBTS.findIndex(d=>d.id===chain._filters.id);
            if(idx>=0) DEBTS.splice(idx,1);
          }
          if(table==='app_reviews'){
            const idx = APP_REVIEWS.findIndex(r=>r.id===chain._filters.id);
            if(idx>=0) APP_REVIEWS.splice(idx,1);
          }
          resolve({data:null,error:null});
        },
      };
      return delChain;
    },
    then(resolve){
      if(table === 'tc_referrals') return resolve({ data: REFERRALS, error:null });
      if(table === 'profiles'){
        if(chain._inFilters.id) return resolve({ data: chain._inFilters.id.map(id=>PROFILES_BY_ID[id]).filter(Boolean), error:null });
        return resolve({ data: [PROFILES_BY_ID['admin-1']], error:null });
      }
      if(table === 'tc_categories'){
        const rows = CATEGORIES.filter(c => !chain._filters.type || c.type===chain._filters.type);
        return resolve({ data: rows, error:null });
      }
      if(table === 'tc_debts'){
        const rows = DEBTS.filter(d => Object.keys(chain._filters).every(k => k==='user_id' || String(d[k])===String(chain._filters[k])));
        return resolve({ data: rows, error:null });
      }
      if(table === 'tc_networth_snapshots'){
        const r = chain._range.snapshot_month || {};
        let rows = Object.values(NETWORTH_SNAPSHOTS).filter(row =>
          (!r.gte || row.snapshot_month >= r.gte) && (!r.lte || row.snapshot_month <= r.lte));
        rows = rows.sort((a,b)=> a.snapshot_month < b.snapshot_month ? -1 : 1);
        return resolve({ data: rows, error:null });
      }
      if(table === 'tc_karma_history'){
        const r = chain._range.taken_at || {};
        let rows = KARMA_HISTORY.filter(row =>
          (!r.gte || row.taken_at >= r.gte) && (!r.lt || row.taken_at < r.lt));
        if(!r.gte && !r.lt) rows = rows.slice(0, 20);
        return resolve({ data: rows, error:null });
      }
      if(table === 'tc_core_beliefs'){
        const r = chain._range.created_at || {};
        const rows = CORE_BELIEFS.filter(row =>
          (!r.gte || row.created_at >= r.gte) && (!r.lt || row.created_at < r.lt));
        return resolve({ data: rows, error:null });
      }
      if(table === 'app_reviews'){
        let rows = APP_REVIEWS;
        if(chain._filters.app) rows = rows.filter(r=>r.app===chain._filters.app);
        if(chain._filters.approved !== undefined) rows = rows.filter(r=>r.approved===chain._filters.approved);
        return resolve({ data: rows, error:null });
      }
      if(table === 'sepay_transactions'){
        let rows = SEPAY_TXNS;
        if(chain._filters.status) rows = rows.filter(r=>r.status===chain._filters.status);
        if(chain._inFilters.transfer_amount) rows = rows.filter(r=>chain._inFilters.transfer_amount.includes(r.transfer_amount));
        return resolve({ data: rows, error:null });
      }
      if(table === 'tc_finance_entries'){
        const r = chain._range.entry_date || {};
        const rows = FINANCE_ENTRIES.filter(e =>
          (!r.gte || e.entry_date >= r.gte) && (!r.lte || e.entry_date <= r.lte) && (!r.lt || e.entry_date < r.lt) &&
          (!chain._filters.entry_date || e.entry_date === chain._filters.entry_date)
        );
        return resolve({ data: rows, error:null });
      }
      resolve({ data: [], error:null });
    },
  };
  return chain;
}
// Mô phỏng thật đăng nhập/đăng ký + onAuthStateChange — để test được luồng khách làm bài Chấm Điểm
// Nghiệp Tiền không cần đăng nhập rồi đăng ký lúc muốn lưu (2026-08-26, góp ý Quỳnh). Mặc định vẫn
// đăng nhập sẵn admin-1 (giữ nguyên hành vi cũ cho mọi test khác) — set window.MOCK_SESSION = null
// TRƯỚC khi initApp() chạy để test ở trạng thái khách. ?uid=member-1 (2026-09-03) — đăng nhập sẵn
// bằng 1 profile CHƯA trả phí (member-1, không role admin/tc_has_paid) để test riêng các màn khoá
// theo tc_has_paid (vd giới thiệu bạn bè) mà không phải đóng giả khách rồi đăng ký lại từ đầu.
window.MOCK_SESSION = /[?&]guest=1/.test(location.search) ? null
  : { user: { id: (location.search.match(/[?&]uid=([^&]+)/)||[])[1] || 'admin-1' } };
let authChangeCb = null;
window.supabaseClient = {
  auth: {
    getSession(){ return Promise.resolve({ data: { session: window.MOCK_SESSION } }); },
    onAuthStateChange(cb){ authChangeCb = cb; return { data: { subscription: { unsubscribe(){} } } }; },
    signOut(){ window.MOCK_SESSION = null; if(authChangeCb) authChangeCb('SIGNED_OUT', null); return Promise.resolve(); },
    signInWithPassword({ email }){
      const session = { user: { id:'guest-user-1', email } };
      window.MOCK_SESSION = session;
      PROFILES_BY_ID['guest-user-1'] = PROFILES_BY_ID['guest-user-1'] || { id:'guest-user-1', role:'student', full_name:'Khách Mới', email };
      if(authChangeCb) authChangeCb('SIGNED_IN', session);
      return Promise.resolve({ data:{ session }, error:null });
    },
    signUp({ email, options }){
      const session = { user: { id:'guest-user-1', email } };
      window.MOCK_SESSION = session;
      PROFILES_BY_ID['guest-user-1'] = { id:'guest-user-1', role:'student', full_name:(options&&options.data&&options.data.full_name)||'', email };
      if(authChangeCb) authChangeCb('SIGNED_IN', session);
      return Promise.resolve({ data:{ session }, error:null });
    },
  },
  from(table){ return makeChain(table); },
  rpc(name){
    if(name==='mark_tc_review_prompt_dismissed') PROFILES_BY_ID['admin-1'].tc_review_prompt_dismissed = true;
    return Promise.resolve({ data:null, error:null });
  },
};
window.REFERRALS = REFERRALS;
</script>
