<script>
  // Đăng ký service worker để trình duyệt cho phép "Thêm vào màn hình chính" như 1 app thật —
  // sw.js không cache gì cả (network passthrough), tránh lặp lại bug cache JS/CSS cũ từng gặp.
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
</script>
