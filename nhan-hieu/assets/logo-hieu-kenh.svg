<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9C878"/>
      <stop offset="0.5" stop-color="#B8862E"/>
      <stop offset="1" stop-color="#8F6A22"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="250" cy="220" r="185" fill="#FFFFFF" stroke="url(#gold)" stroke-width="7"/>

  <!-- scattered data squares -->
  <g fill="#1E4B3F">
    <rect x="128" y="150" width="16" height="16" rx="2"/>
    <rect x="152" y="130" width="14" height="14" rx="2"/>
    <rect x="150" y="172" width="18" height="18" rx="2"/>
    <rect x="178" y="188" width="15" height="15" rx="2"/>
  </g>
  <g fill="#C99A3E">
    <rect x="180" y="150" width="12" height="12" rx="2"/>
    <rect x="126" y="192" width="12" height="12" rx="2"/>
  </g>

  <!-- ascending bars -->
  <g>
    <rect x="196" y="248" width="34" height="72" rx="6" fill="#1E4B3F"/>
    <rect x="238" y="218" width="34" height="102" rx="6" fill="#20523F"/>
    <rect x="280" y="184" width="34" height="136" rx="6" fill="#1E4B3F"/>
    <rect x="322" y="150" width="34" height="170" rx="6" fill="#20523F"/>
  </g>

  <!-- upward arrow -->
  <path d="M200 210 C 245 200, 290 175, 330 130" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
  <polygon points="330,130 300,132 322,158" fill="url(#gold)"/>

  <!-- play button badge -->
  <circle cx="262" cy="292" r="46" fill="#1E4B3F" stroke="url(#gold)" stroke-width="7"/>
  <polygon points="250,272 250,312 284,292" fill="url(#gold)"/>

  <!-- bottom leaf/wave -->
  <path d="M85 300 C 150 360, 200 372, 262 340 C 324 372, 374 360, 420 305
           C 405 350, 350 388, 262 382 C 174 388, 100 350, 85 300 Z" fill="#1E4B3F"/>

  <!-- wordmark -->
  <g font-family="Georgia, 'Playfair Display', serif" text-anchor="middle" fill="url(#gold)">
    <text x="250" y="452" font-size="58" font-weight="700" letter-spacing="4">HIỂU KÊNH</text>
    <rect x="106" y="428" width="34" height="4" fill="url(#gold)"/>
    <rect x="360" y="428" width="34" height="4" fill="url(#gold)"/>
  </g>
  <rect x="205" y="474" width="90" height="3" fill="url(#gold)"/>
  <text x="250" y="508" font-family="'Be Vietnam Pro', sans-serif" font-size="20" letter-spacing="3" text-anchor="middle" fill="#1E4B3F">HIỂU ĐỂ XÂY KÊNH</text>
</svg>
